server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: canteen-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/canteen_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

security:
  jwt:
    secret: ${JWT_SECRET}

